<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log masuk — BayarTerus</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="narrow">
    <a class="logo" href="/" style="justify-content:center;margin-bottom:20px"><span class="mark">BT</span>BayarTerus</a>
    <div class="card">
      <h1>Log masuk</h1>
      <div id="error" class="alert error hidden"></div>
      <form id="form">
        <div class="field"><label for="email">Emel</label><input id="email" name="email" type="email" required autocomplete="email"></div>
        <div class="field"><label for="password">Kata laluan</label><input id="password" name="password" type="password" required autocomplete="current-password"></div>
        <button class="btn block">Log masuk</button>
      </form>
      <p class="muted small" style="margin:14px 0 0">Belum ada akaun? <a href="/register">Daftar</a></p>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script>
    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const err = document.getElementById('error');
      try {
        await BT.api('/dashboard/api/auth/login', { method: 'POST', body: BT.formData(e.target) });
        location.href = '/dashboard';
      } catch (x) { err.textContent = x.message; err.classList.remove('hidden'); }
    };
  </script>
</body>
</html>
